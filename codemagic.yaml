# ─────────────────────────────────────────────────────────────────────────────
# Codemagic CI/CD — My Digital Holidays iOS build
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED — Codemagic → your app → Environment variables
# Group "signing":
#   APP_STORE_CONNECT_KEY_IDENTIFIER   (your key ID, e.g. 67K2T48W7Y)
#   APP_STORE_CONNECT_ISSUER_ID        (your issuer ID)
#   APP_STORE_CONNECT_PRIVATE_KEY      Full .p8 file contents (mark Secure)
#
# Group "build_env":
#   VITE_API_BASE_URL                  Your deployed API URL
#   VITE_REVENUECAT_IOS_KEY            RevenueCat iOS public API key (appl_…)

workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalholidays.app
      xcode: latest
      node: 22
      groups:
        - signing
        - build_env
      vars:
        VITE_API_BASE_URL: https://my-digital-holidays.replit.app/api
        XCODE_SCHEME: App
        XCODE_PROJECT: artifacts/outfit-generator/ios/App/App.xcodeproj
        XCODE_WORKSPACE: artifacts/outfit-generator/ios/App/App.xcodeproj/project.xcworkspace
        COREPACK_ENABLE_STRICT: "0"
        BUNDLE_ID: com.mydigitalholidays.app
        TEAM_ID: 2A78MFVCJS
        PROFILE_NAME: My Digital Holidays
        APP_STORE_CONNECT_ISSUER_ID: 66d4ce13-148d-4d6b-bab8-f1d0d8441a1e
        APP_STORE_CONNECT_KEY_IDENTIFIER: QYK7FSLWXZ

    scripts:
      - name: Install pnpm and dependencies
        script: |
          corepack disable || true
          npm install -g pnpm@9 --force
          pnpm install --no-frozen-lockfile

      - name: Build web assets
        script: |
          cd artifacts/outfit-generator
          VITE_API_BASE_URL=$VITE_API_BASE_URL \
          VITE_REVENUECAT_IOS_KEY=$VITE_REVENUECAT_IOS_KEY \
          pnpm vite build --config vite.capacitor.config.ts

      - name: Dereference pnpm symlinks for Capacitor iOS
        script: |
          # pnpm stores packages as symlinks. Xcode's SPM resolver cannot follow
          # symlinks for local package references, so the RC plugin's Swift code
          # is never compiled into the binary and bridge calls hang forever.
          cd artifacts/outfit-generator
          RC_PATH="node_modules/@revenuecat/purchases-capacitor"
          if [ -L "$RC_PATH" ]; then
            echo "Dereferencing pnpm symlink: $RC_PATH"
            cp -rL "$RC_PATH" "${RC_PATH}-real"
            rm "$RC_PATH"
            mv "${RC_PATH}-real" "$RC_PATH"
            echo "Done — $(ls $RC_PATH)"
          else
            echo "Not a symlink, skipping: $RC_PATH"
          fi

      - name: Capacitor add iOS and sync
        script: |
          cd artifacts/outfit-generator
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Inject app icon
        script: |
          ICONSET="artifacts/outfit-generator/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -z 1024 1024 app-store/AppIcon-1024.png --out "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Share App scheme
        script: |
          SCHEMES_DIR="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$SCHEMES_DIR"
          # If Capacitor created a shared scheme already, leave it; otherwise copy from userdata
          if [ ! -f "$SCHEMES_DIR/App.xcscheme" ]; then
            USER_SCHEME=$(find "$XCODE_PROJECT/xcuserdata" -name "App.xcscheme" 2>/dev/null | head -1)
            if [ -n "$USER_SCHEME" ]; then
              cp "$USER_SCHEME" "$SCHEMES_DIR/App.xcscheme"
            fi
          fi
          echo "Shared schemes:"
          ls -la "$SCHEMES_DIR"
          echo "Available targets/schemes:"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Set build number and encryption declaration
        script: |
          cd artifacts/outfit-generator/ios/App
          agvtool new-version -all $BUILD_NUMBER
          # Declare no non-exempt encryption so TestFlight never asks
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist
          # Required for Face ID usage
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'My Digital Holidays uses Face ID to protect your wardrobe.'" App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'My Digital Holidays uses Face ID to protect your wardrobe.'" App/Info.plist
          # Camera & photo library — explicitly injected here because cap sync does
          # not reliably write infoPlist values into an existing Info.plist on every run.
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'My Holidays uses your camera to photograph items for your wardrobe.'" App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'My Holidays uses your camera to photograph items for your wardrobe.'" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'My Holidays reads your photo library so you can add existing photos to your wardrobe.'" App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'My Holidays reads your photo library so you can add existing photos to your wardrobe.'" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'My Holidays saves photos you take back to your photo library.'" App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'My Holidays saves photos you take back to your photo library.'" App/Info.plist

      - name: Re-apply provisioning profiles after cap sync
        script: |
          echo "=== Provisioning profiles on machine ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles directory found"
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning 2>/dev/null || echo "No signing identities found"
          echo "=== Running xcode-project use-profiles ==="
          xcode-project use-profiles \
            --project artifacts/outfit-generator/ios/App/App.xcodeproj \
            --verbose 2>&1 || true
          echo "=== Profiles after use-profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "Still no profiles"

      - name: Resolve Swift Package dependencies
        script: |
          cd artifacts/outfit-generator/ios/App
          xcodebuild \
            -resolvePackageDependencies \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App

      - name: Xcode archive
        script: |
          cd artifacts/outfit-generator/ios/App
          xcodebuild \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            DEVELOPMENT_TEAM=2A78MFVCJS \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="My Digital Holidays AppStore" \
            INFOPLIST_KEY_NSCameraUsageDescription="My Holidays uses your camera to photograph items for your wardrobe." \
            INFOPLIST_KEY_NSPhotoLibraryUsageDescription="My Holidays reads your photo library so you can add existing photos to your wardrobe." \
            INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription="My Holidays saves photos you take back to your photo library." \
            INFOPLIST_KEY_NSFaceIDUsageDescription="My Digital Holidays uses Face ID to protect your wardrobe." \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            archive

      - name: Export IPA
        script: |
          echo "=== Profiles on disk before export ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "EMPTY — no profiles directory"
          ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || echo "EMPTY — no Xcode profiles directory"
          echo "=== Export options plist ==="
          cat /Users/builder/export_options.plist 2>/dev/null || echo "export_options.plist not found, falling back to app-store/ExportOptions.plist"
          PLIST=/Users/builder/export_options.plist
          [ -f "$PLIST" ] || PLIST=app-store/ExportOptions.plist
          echo "=== Using plist: $PLIST ==="
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$CM_BUILD_DIR/build/ipa"

      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path "$CM_BUILD_DIR/build/ipa/App.ipa" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY"

    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
